const HopeEmojiSlider = ({ currentSelection, onSelect, anchors, currentQ }) => {
    const [hoverEmoji, setHoverEmoji] = window.React.useState(null);
    const [burstKey, setBurstKey] = window.React.useState(0);
    const [burstValue, setBurstValue] = window.React.useState(null);
    
    // Pro Slider State
    const [isDragging, setIsDragging] = window.React.useState(false);
    
    // Clamp the initial value to 1.0 minimum so the slider thumb never flies off-screen
    const safeSelection = currentSelection !== null && currentSelection >= 1.0 ? currentSelection : 1.0;
    const [rawValue, setRawValue] = window.React.useState(safeSelection);

    // Sync rawValue with safeSelection when not dragging
    window.React.useEffect(() => {
        if (!isDragging) {
            setRawValue(currentSelection !== null && currentSelection >= 1.0 ? currentSelection : 1.0);
        }
    }, [currentSelection, isDragging]);

    const displayValue = rawValue;
    const snappedValue = Math.round(displayValue * 2) / 2;

    const triggerBurst = (rating) => {
        setBurstValue(rating);
        setBurstKey(prev => prev + 1); // Force React to remount the animation spans
        setTimeout(() => setBurstValue(null), 800);
    };

    const handleEmojiClick = (rating) => {
        setIsDragging(false);
        onSelect(rating);
        setRawValue(rating);
        triggerBurst(rating);
    };

    const handleSliderChange = (e) => {
        const v = parseFloat(e.target.value);
        setRawValue(v);
        const snapped = Math.round(v * 2) / 2;
        if (snapped !== currentSelection) {
            onSelect(snapped);
        }
    };

    const handleDragStart = () => setIsDragging(true);
    
    const handleDragEnd = () => {
        setIsDragging(false);
        const snapped = Math.round(rawValue * 2) / 2;
        setRawValue(snapped);
        onSelect(snapped);
        triggerBurst(snapped);
    };

    const getAnchorData = (key) => {
        const fullText = anchors && anchors[key];
        if (!fullText) return { title: '', desc: '' };
        const match = fullText.match(/\(([^)]+)\)/);
        const title = match ? match[1] : fullText.split(':')[0].replace(/\d\s*Stars?/, '').trim();
        const desc = fullText.includes(':') ? fullText.split(':')[1].trim() : fullText;
        return { title: title.toLowerCase(), desc };
    };

    const shitholeData = getAnchorData("1.0");
    const stableData = getAnchorData("3.0");
    const sanctuaryData = getAnchorData("5.0");

    const emojis = {
        "1.0": ["1f622", "1f44e", "1f61f"], // 😢, 👎, 😟
        "3.0": ["1f610", "1f44d", "1f642"], // 😐, 👍, 🙂
        "5.0": ["1f44f", "1f496", "1f389"]  // 👏, 💖, 🎉
    };
    
    const getAppleEmojiUrl = (hex) => `https://unpkg.com/emoji-datasource-apple@15.0.1/img/apple/64/${hex}.png`;

    const getGlowStyles = (zone) => {
        // Only light up the zone if an emoji is actually selected (or actively dragging)
        if (currentSelection === null && !isDragging) return "opacity-75 border-transparent";
        
        const isZoneSelected = 
            (zone === 1 && snappedValue >= 1.0 && snappedValue <= 2.0) ||
            (zone === 3 && snappedValue >= 2.5 && snappedValue <= 3.5) ||
            (zone === 5 && snappedValue >= 4.0 && snappedValue <= 5.0);
            
        return isZoneSelected ? "opacity-100 border-transparent" : "opacity-75 border-transparent";
    };
    
    const getZoneColor = (zone) => {
        if (zone === 1) return "text-blue-600";
        if (zone === 3) return "text-slate-500";
        if (zone === 5) return "text-purple-600";
        return "text-slate-500";
    }

    const renderEmoji = (zone, index, emojiStr, valueToSelect) => {
        const isHovered = hoverEmoji === `${zone}-${index}`;
        // Only treat as selected if an actual selection was made or the user is dragging
        const isSelected = (currentSelection !== null || isDragging) && (snappedValue === valueToSelect);
        const isBursting = burstValue === valueToSelect;
        
        let scaleClass = "scale-100 translate-y-0";
        let ringClass = "";
        let colorClass = "grayscale opacity-50"; // Default: gray and slightly faded
        
        // We only want ONE emoji visually active at a time.
        // If the user is actively hovering ANY emoji, the selected emoji temporarily fades out.
        const isActiveSelection = isSelected && !hoverEmoji;
        
        if (isHovered) {
            scaleClass = "scale-150 -translate-y-2 z-30 brightness-125";
            colorClass = "grayscale-0 opacity-100"; // Full color on hover!
        } else if (isActiveSelection) {
             scaleClass = "scale-125 z-20";
             colorClass = "grayscale-0 opacity-100"; // Full color when selected!
        }
        
        // Apply the glowing circle to the emoji if it is hovered OR it is the active selection
        if (isHovered || isActiveSelection) {
             ringClass = zone === 1 ? "ring-2 ring-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.8)]" : 
                         zone === 3 ? "ring-2 ring-slate-400 shadow-[0_0_15px_rgba(148,163,184,0.8)]" : 
                         "ring-2 ring-purple-500 shadow-[0_0_15px_rgba(168,85,247,0.8)]";
        }

const HopeChart = ({ answers, surveyQuestions, isFinal, onViewDashboard }) => {
    const [isMounted, setIsMounted] = useState(false);
    const totalScore = Object.values(answers).reduce((a, b) => a + b, 0); 
    
    useEffect(() => {
        setTimeout(() => setIsMounted(true), 100);
    }, []);

    const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
        const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
        return {
            x: centerX + (radius * Math.cos(angleInRadians)),
            y: centerY + (radius * Math.sin(angleInRadians))
        };
    };

    const describeArc = (x, y, innerRadius, outerRadius, startAngle, endAngle) => {
        const startOut = polarToCartesian(x, y, outerRadius, endAngle);
        const endOut = polarToCartesian(x, y, outerRadius, startAngle);
        const startIn = polarToCartesian(x, y, innerRadius, endAngle);
        const endIn = polarToCartesian(x, y, innerRadius, startAngle);
        const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
        return [
            "M", startOut.x, startOut.y,
            "A", outerRadius, outerRadius, 0, largeArcFlag, 0, endOut.x, endOut.y,
            "L", endIn.x, endIn.y,
            "A", innerRadius, innerRadius, 0, largeArcFlag, 1, startIn.x, startIn.y,
            "Z"
        ].join(" ");
    };

    const cx = 500;
    const cy = 340; // Moved up
    const innerR = 145; // Scaled down 15%
    const maxOutR = 290; // Scaled down 15%
    
    const dimensionColors = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#00c7ff', '#af52de'];
    const dimensionNames = ["PLACES", "BODY", "RESOURCES", "SELF", "OTHERS", "LIFE"];

                </p>
            </div>

            <div className="relative w-full flex flex-col items-center justify-start overflow-hidden z-10 pt-8" style={{ minHeight: 0 }}>
                {/* SVG Gauge */}

                    <svg viewBox="0 0 1000 480" className="w-full h-full drop-shadow-2xl overflow-visible absolute top-0 left-0">
                        <defs>
                            <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="3" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>

                        {dimensionNames.map((name, i) => {
                            const startA = -90 + (i * 30);

                                </g>
                            );
                        })}

const ResultsScreen = ({ answers, surveyQuestions, onViewDashboard }) => {

};

    // --- DASHBOARD COMPONENT ---
    const Dashboard = ({ user, history, onRetake }) => {
        if (!history || history.length === 0) return null;
        
        const sortedHistory = [...history].sort((a, b) => new Date(a.date) - new Date(b.date));
        const latest = sortedHistory[sortedHistory.length - 1];
        
        // Find lowest dimension from latest survey
        const dimensionScores = {};
        surveyQuestions.forEach(q => {
            if (!dimensionScores[q.dimension]) dimensionScores[q.dimension] = { sum: 0, count: 0, space: q.space };
            if (latest.answers[q.id]) {
                dimensionScores[q.dimension].sum += parseFloat(latest.answers[q.id].value);
                dimensionScores[q.dimension].count++;
            }
        });
        
        let lowestDimension = null;
        let lowestScore = 6;
        for (const dim in dimensionScores) {
            const avg = dimensionScores[dim].sum / dimensionScores[dim].count;
            if (avg < lowestScore) {
                lowestScore = avg;
                lowestDimension = { name: dim, score: avg, space: dimensionScores[dim].space };
            }
        }
        
        // Simple SVG Chart Config
        const chartWidth = 600;
        const chartHeight = 250;
        const padding = 40;
        
        const minCapacity = Math.max(0, Math.min(...sortedHistory.map(h => h.capacity)) - 10);
        const maxCapacity = Math.min(100, Math.max(...sortedHistory.map(h => h.capacity)) + 10);
        
        const getX = (index) => padding + (index * ((chartWidth - padding * 2) / Math.max(1, sortedHistory.length - 1)));
        const getY = (val) => chartHeight - padding - ((val - minCapacity) / Math.max(1, maxCapacity - minCapacity)) * (chartHeight - padding * 2);

        const points = sortedHistory.map((h, i) => `${getX(i)},${getY(h.capacity)}`).join(" ");

        return (
            <main className="flex-grow flex flex-col items-center justify-center p-4 md:p-6 relative" style={{ minHeight: 'calc(100vh - 80px)' }}>
                <div className="bg-white max-w-4xl w-full p-8 md:p-12 rounded-[2rem] shadow-2xl border border-slate-100 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 to-purple-500"></div>
                    
                    <div className="flex justify-between items-center mb-8 border-b border-slate-100 pb-6">
                        <div>
                            <h1 className="text-4xl font-black text-slate-800 tracking-tight">Your Progress Dashboard</h1>
                            <p className="text-slate-500 mt-2">Welcome back, {user?.email}!</p>
                        </div>
                        <div className="text-center bg-blue-50 px-6 py-3 rounded-2xl border border-blue-100">
                            <p className="text-xs font-bold text-blue-800 uppercase tracking-widest mb-1">Latest Capacity</p>
                            <p className="text-3xl font-black text-blue-600">{latest.capacity.toFixed(1)}%</p>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                        <div className="bg-slate-50 rounded-2xl p-6 border border-slate-200">
                            <h3 className="font-bold text-slate-700 mb-6 uppercase tracking-widest text-sm flex items-center gap-2">
                                <svg className="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                                Growth Timeline
                            </h3>
                            <div className="w-full overflow-x-auto">
                                <svg width="100%" height={chartHeight} viewBox={`0 0 ${chartWidth} ${chartHeight}`} className="overflow-visible">
                                    {/* Grid lines */}
                                    {[0, 0.25, 0.5, 0.75, 1].map(pct => {
                                        const y = chartHeight - padding - (pct * (chartHeight - padding * 2));
                                        return (
                                            <g key={pct}>
                                                <line x1={padding} y1={y} x2={chartWidth - padding} y2={y} stroke="#e2e8f0" strokeDasharray="4 4" />
                                                <text x={padding - 10} y={y + 4} textAnchor="end" fontSize="12" fill="#64748b" fontWeight="bold">
                                                    {(minCapacity + pct * (maxCapacity - minCapacity)).toFixed(0)}%
                                                </text>
                                            </g>
                                        );
                                    })}
                                    {/* Line */}
                                    <polyline points={points} fill="none" stroke="#3b82f6" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
                                    {/* Points */}
                                    {sortedHistory.map((h, i) => (
                                        <g key={i} className="group cursor-pointer">
                                            <circle cx={getX(i)} cy={getY(h.capacity)} r="6" fill="#fff" stroke="#3b82f6" strokeWidth="3" className="transition-all duration-300 group-hover:r-8 group-hover:fill-blue-50" />
                                            <text x={getX(i)} y={getY(h.capacity) - 15} textAnchor="middle" fontSize="12" fill="#334155" fontWeight="bold" opacity="0" className="group-hover:opacity-100 transition-opacity">
                                                {h.capacity.toFixed(1)}%
                                            </text>
                                            <text x={getX(i)} y={chartHeight - 15} textAnchor="middle" fontSize="11" fill="#94a3b8" fontWeight="bold">
                                                {new Date(h.date).toLocaleDateString(undefined, {month:'short', day:'numeric'})}
                                            </text>
                                        </g>
                                    ))}
                                </svg>
                            </div>
                        </div>

                        <div className="flex flex-col gap-6">
                            <div className="bg-emerald-50 rounded-2xl p-6 border border-emerald-100 flex-grow">
                                <h3 className="font-bold text-emerald-800 mb-3 uppercase tracking-widest text-sm flex items-center gap-2">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    Interpretation
                                </h3>
                                <p className="text-emerald-950 leading-relaxed">
                                    You have completed <strong>{history.length}</strong> assessment(s). Your current HoPE Capacity indicates your overall stability. 
                                    Monitoring this trend helps ensure you are continuously moving toward an optimized personal experience.
                                </p>
                            </div>

                            {lowestDimension && (

                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                        Recommended Action
                                    </h3>
                                    <p className="text-rose-950 leading-relaxed mb-4">
                                        Your lowest score was in <strong>{lowestDimension.name}</strong> ({lowestDimension.score.toFixed(1)}/5) within your {lowestDimension.space}. 
                                    </p>
                                    <a href="rebuilding-life-challenges.html" className="inline-block bg-white text-rose-700 font-bold px-5 py-2.5 rounded-full border border-rose-200 hover:bg-rose-100 transition-colors shadow-sm text-sm">
                                        Explore Rebuilding Modules →
                                    </a>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="flex justify-center mt-6">
                        <button 
                            onClick={onRetake}
                            className="bg-slate-900 text-white px-8 py-4 rounded-full font-bold text-lg hover:bg-slate-800 hover:-translate-y-1 transition-all shadow-xl hover:shadow-[0_10px_25px_rgba(15,23,42,0.3)] inline-flex items-center gap-3"
                        >
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Retake Assessment
                        </button>
                    </div>
                </div>
            </main>
        );
    };

    // --- AUTHENTICATION MODAL COMPONENT ---
    const AuthModal = ({ onClose, onLogin }) => {
        const [isSignUp, setIsSignUp] = React.useState(false);
        const [email, setEmail] = React.useState("");
        const [password, setPassword] = React.useState("");
        const [error, setError] = React.useState("");
        const [loading, setLoading] = React.useState(false);

        const handleSubmit = async (e) => {
            e.preventDefault();
            if (!window.firebaseAuth) {
                setError("Firebase is not configured yet. Please contact support.");
                return;
            }
            setLoading(true);
            setError("");
            try {
                if (isSignUp) {
                    await window.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
                } else {
                    await window.signInWithEmailAndPassword(window.firebaseAuth, email, password);
                }
                onLogin();
                onClose();
            } catch (err) {
                console.error(err);
                setError(err.message.replace("Firebase:", "").trim());
            } finally {
                setLoading(false);
            }
        };

        return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
                <div className="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl relative">
                    <button onClick={onClose} className="absolute top-5 right-5 text-slate-400 hover:text-slate-600 transition-colors">
                        <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                    
                    <h2 className="text-3xl font-black text-slate-900 mb-2">{isSignUp ? "Create Account" : "Welcome Back"}</h2>
                    <p className="text-slate-500 mb-6">{isSignUp ? "Sign up to save your HoPE Index progress." : "Log in to resume your HoPE Index."}</p>

                    {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-100">{error}</div>}

                    <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">Email Address</label>
                            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required className="w-full border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-colors" placeholder="you@example.com" />
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">Password</label>
                            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required minLength="6" className="w-full border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition-colors" placeholder="••••••••" />
                        </div>
                        <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl mt-2 transition-all transform active:scale-95 flex justify-center items-center">
                            {loading ? (
                                <svg className="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>

const App = () => {
    const [step, setStep] = useState('intro'); // 'intro', 'survey', 'results', 'dashboard'
    const [currentQIndex, setCurrentQIndex] = useState(0);
    const [answers, setAnswers] = useState({}); 
    const [currentSelection, setCurrentSelection] = useState(null);
    const [surveyHistory, setSurveyHistory] = useState([]);

    // --- AUTHENTICATION & PROGRESS STATE ---
    const [user, setUser] = useState(null);
    const [authLoading, setAuthLoading] = useState(true);
    const [showAuthModal, setShowAuthModal] = useState(false);

    useEffect(() => {
        if (!window.firebaseAuth) {
            setAuthLoading(false);
            return;
        }
        const unsubscribe = window.onAuthStateChanged(window.firebaseAuth, async (currentUser) => {
            setUser(currentUser);
            setAuthLoading(false);
            if (currentUser) {
                try {
                    const docRef = window.doc(window.firebaseDb, "hope_surveys", currentUser.uid);
                    const docSnap = await window.getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        
                        if (data.history) {
                            setSurveyHistory(data.history);
                        }

                        if (data.answers && Object.keys(data.answers).length > 0) {
                            setAnswers(data.answers);
                            const answeredCount = Object.keys(data.answers).length;
                            if (answeredCount > 0 && answeredCount < surveyQuestions.length) {
                                setCurrentQIndex(answeredCount);
                                setStep('survey');
                            } else if (answeredCount >= surveyQuestions.length) {
                                setStep('results');
                            }
                        } else if (data.history && data.history.length > 0) {
                            // If they have history but no active survey, go to Dashboard
                            setStep('dashboard');
                        }
                    }
                } catch (error) {
                    console.error("Error loading progress:", error);
                }
            }
        });
        return () => unsubscribe && unsubscribe();
    }, []);

    const saveProgress = async (newAnswers) => {
        if (!user || !window.firebaseDb) return;
        try {
            await window.setDoc(window.doc(window.firebaseDb, "hope_surveys", user.uid), {
                answers: newAnswers,
                updatedAt: new Date().toISOString()
            }, { merge: true });
        } catch (error) {
            console.error("Error saving progress:", error);
        }
    };

    const finishSurvey = async (finalAnswers) => {
        if (!user || !window.firebaseDb) return;
        
        const totalScore = surveyQuestions.reduce((sum, q) => sum + parseFloat(finalAnswers[q.id].value), 0);
        const capacity = ((totalScore / (surveyQuestions.length * 5)) * 100);
        
        const newHistoryItem = {
            date: new Date().toISOString(),
            answers: finalAnswers,
            capacity: capacity
        };
        
        const updatedHistory = [...surveyHistory, newHistoryItem];
        setSurveyHistory(updatedHistory);
        
        try {
            await window.setDoc(window.doc(window.firebaseDb, "hope_surveys", user.uid), {
                answers: {}, // Clear in-progress survey
                history: updatedHistory,
                updatedAt: new Date().toISOString()
            }, { merge: true });
        } catch (error) {
            console.error("Error saving final survey:", error);
        }
    };

    const handleNextQ = () => {
        if (currentSelection === null) return;
        
        const qId = surveyQuestions[currentQIndex].id;
        const newAnswers = { ...answers, [qId]: currentSelection };
        setAnswers(newAnswers);
        
        if (currentQIndex < surveyQuestions.length - 1) {
            saveProgress(newAnswers);
            setCurrentQIndex(currentQIndex + 1);
            setCurrentSelection(newAnswers[surveyQuestions[currentQIndex + 1].id] ?? null);
        } else {
            finishSurvey(newAnswers);
            setStep('results');
        }
    };

    const handlePrevQ = () => {
        if (currentQIndex > 0) {
            setCurrentQIndex(currentQIndex - 1);
            setCurrentSelection(answers[surveyQuestions[currentQIndex - 1].id] ?? null);
        } else {
            setStep('intro');
        }
    };

    // --- DYNAMIC AUTH WIDGET ---
    const renderAuthWidget = (customClass = "") => (
        <div className={`transition-all duration-300 z-50 ${customClass}`}>
            {authLoading ? (
                <div className="w-8 h-8 rounded-full border-2 border-blue-500 border-t-transparent animate-spin shadow-md mx-auto"></div>
            ) : user ? (
                <div className="flex items-center justify-center gap-3 bg-slate-100 text-slate-600 px-5 py-2.5 rounded-full border border-slate-200">
                    <div className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span className="font-bold text-sm hidden sm:block">{user.email}</span>
                    <button onClick={() => window.signOut(window.firebaseAuth).then(() => { setAnswers({}); setStep('intro'); setCurrentQIndex(0); })} className="text-slate-400 hover:text-slate-700 font-bold text-sm transition-colors sm:ml-2 sm:border-l border-slate-300 sm:pl-3">Log Out</button>
                </div>
            ) : (
                <button onClick={() => setShowAuthModal(true)} className="text-blue-600 font-bold hover:text-blue-700 transition-colors flex items-center justify-center gap-2 text-sm bg-blue-50 hover:bg-blue-100 px-6 py-3 rounded-full w-full md:w-auto border border-blue-100 shadow-sm">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                    Log in to track your progress
                </button>
            )}
            {showAuthModal && <AuthModal onClose={() => setShowAuthModal(false)} onLogin={() => {}} />}
        </div>
    );

    if (step === 'dashboard') {
        return (
            <div className="relative">
                {renderAuthWidget("absolute top-4 right-4 md:top-6 md:right-6")}
                <Dashboard 
                    user={user} 
                    history={surveyHistory} 
                    onRetake={() => {
                        setAnswers({});
                        setCurrentQIndex(0);
                        setStep('intro');
                    }} 
                />
            </div>
        );
    }

    if (step === 'intro') {
        return (
            <main className="flex-grow flex flex-col items-center justify-center p-6 relative" style={{ minHeight: 'calc(100vh - 80px)' }}>
                <div className="bg-white max-w-3xl w-full p-8 md:p-12 rounded-[2rem] shadow-2xl border border-slate-100 text-center relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-emerald-500 via-blue-500 to-purple-500"></div>
                    <h1 className="text-5xl font-black text-slate-800 mb-6 tracking-tight">The HoPE Index</h1>
                    <h2 className="text-xl font-bold text-slate-500 mb-8 uppercase tracking-widest">Human Optimal Personal Experience</h2>
                    <div className="text-left space-y-6 text-slate-600 text-lg leading-relaxed mb-10">
                        <p>Welcome to the HoPE Index. This is not a test or an academic exam. It is a highly visual platform designed to map where you are today and provide a clear, actionable guide toward true stability.</p>
                        <div className="bg-blue-50 border border-blue-100 p-6 rounded-2xl shadow-sm">
                            <h3 className="font-bold text-blue-900 mb-2 flex items-center gap-2">
                                <span className="text-xl">💡</span> How to Complete this Survey
                            </h3>
                            <p className="text-base text-blue-800">Imagine you are a professional critic writing a review for a hotel or an app. You are not rating your worth. You are rating the quality of the experience provided by different areas of your life.</p>
                        </div>
                    </div>
                    
                    <div className="flex flex-col items-center justify-center gap-4 mt-2">
                        {renderAuthWidget("w-full md:w-auto mb-2")}
                        <button 
                            onClick={() => { 
                                setStep('survey'); 
                                setCurrentSelection(answers[surveyQuestions[0].id] ?? null); 
                            }}
                            className="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-10 py-5 rounded-full font-bold text-xl hover:-translate-y-1 transition-all shadow-xl hover:shadow-[0_10px_25px_rgba(79,70,229,0.4)] inline-flex items-center justify-center gap-3 w-full md:w-auto"
                        >
                            Let's Begin →
                        </button>
                    </div>
                </div>
            </main>
        );
    }

    if (step === 'results') {
        return (
            <div className="relative">
                {renderAuthWidget("absolute top-4 right-4 md:top-6 md:right-6 z-50")}
                <ResultsScreen 
                    answers={answers} 
                    surveyQuestions={surveyQuestions} 
                    onViewDashboard={(user && surveyHistory && surveyHistory.length > 0) ? () => setStep('dashboard') : null} 
                />
            </div>
        );
    }

    const q = surveyQuestions[currentQIndex];
    const progress = ((currentQIndex + 1) / surveyQuestions.length) * 100;

    return (
        <main className="flex-grow w-full max-w-[1800px] mx-auto p-4 md:p-6 flex flex-col relative" style={{ minHeight: 'calc(100vh - 80px)' }}>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6 flex-grow items-stretch lg:h-full">
                
                {/* Left Panel - Survey Form (50%) */}
                <div className="flex flex-col bg-white rounded-[2rem] shadow-2xl border border-slate-100 relative overflow-hidden lg:h-full lg:min-h-0" style={{ transform: 'translateZ(0)' }}>

                    
                    <div className="p-6 md:p-8 pt-10 flex-grow flex flex-col lg:h-full lg:overflow-y-auto custom-scrollbar">
                        
                        {/* Header & Meta */}
                        <div className="flex justify-between items-center mb-6 shrink-0">
                            <div className="inline-block bg-blue-50 text-blue-700 px-3 py-1 rounded-lg font-bold uppercase tracking-widest text-[10px] border border-blue-100">
                                {q.space}
                            </div>
                        </div>

                        {/* Title & Concept */}
                        <div className="mb-4 shrink-0 w-full">
                            <div className="text-slate-400 font-bold text-sm tracking-wide mb-3">{q.dimension}</div>
                            <h2 className="font-black text-slate-900 text-3xl md:text-4xl tracking-tight leading-tight mb-1">{q.title}</h2>
                            {q.subtitle && <p className="text-slate-500 font-medium text-[15px] mb-5">{q.subtitle}</p>}

                        </div>

                        {/* Interactive Card Selector */}
                        <HopeEmojiSlider 
                            currentSelection={currentSelection} 
                            onSelect={(val) => {
                                setCurrentSelection(val);
                            }} 
                            anchors={q.anchors} 
                            currentQ={q}
                        />

                        {/* Navigation Footer */}
                        <div className="flex justify-between items-center mt-4 pt-4 border-t border-slate-100 shrink-0">
                            <button 
                                onClick={handlePrevQ}
                                className={`text-slate-500 font-bold hover:text-slate-800 px-6 py-2 transition-colors flex items-center gap-2 ${currentQIndex === 0 ? 'invisible' : ''}`}
                            >
                                <span>←</span> Back
                            </button>
                            <button 
                                onClick={handleNextQ}
                                disabled={currentSelection === null}
                                className={`px-6 py-2 rounded-full font-bold text-sm transition-all flex items-center gap-2 ${currentSelection === null ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-gradient-to-r from-blue-600 to-purple-600 text-white hover:-translate-y-1 shadow-md hover:shadow-lg'}`}
                            >
                                {currentQIndex === surveyQuestions.length - 1 ? 'Submit' : 'Next'} <span>→</span>
                            </button>
                        </div>
                    </div>
                </div>

                {/* Right Panel - Live Visualization (50%) */}
                <div className="flex flex-col w-full h-full relative rounded-[2rem] shadow-2xl overflow-hidden bg-[#02050a] border border-cyan-500/20 lg:min-h-0 min-h-[500px]">
                    <div className="absolute inset-0 pointer-events-none" style={{
                        backgroundImage: 'radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.08) 0%, transparent 60%), linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px)',
                        backgroundSize: '100% 100%, 30px 30px, 30px 30px',
                        backgroundPosition: 'center center'
                    }}></div>
                    <HopeChart answers={{...answers, [q.id]: currentSelection !== null ? currentSelection : 0.0}} surveyQuestions={surveyQuestions} isFinal={false} />
                </div>
            </div>
        </main>
    );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
