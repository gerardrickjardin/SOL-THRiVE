            -webkit-appearance: none;

            height: 12px;

            border-radius: 10px;
            outline: none;
            margin: 0;
            position: relative;
            z-index: 10;
            cursor: pointer;
        }

        .hope-range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #2962FF; 
            cursor: grab;
            border: 4px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .hope-range-slider::-webkit-slider-thumb:active {
            cursor: grabbing;
            transform: scale(1.2);
        }
        .hope-range-slider::-moz-range-thumb {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #2962FF;
            cursor: grab;
            border: 4px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .ticks-container {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            margin-top: 15px;
        }
        .tick-mark {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 20px;
        }
        .tick-mark::before {
            content: '';
            height: 8px;
            width: 3px;
            background-color: #B0BEC5;
            border-radius: 2px;
            margin-bottom: 5px;
            margin-top: -15px; /* Pulls tick close to track */
        }
        .tick-mark span {
            font-size: 12px;
            font-weight: 600;
            color: #546E7A;
        }

            text-align: center;

const HopeSlider = ({ currentSelection, setCurrentSelection, currentQ, onNext }) => {
    const val = currentSelection !== null ? currentSelection : 0.0;
    const [hoverValue, setHoverValue] = useState(null);

    const handleStarClick = (rating) => {
        setCurrentSelection(rating);
        // Add a tiny delay before advancing so they can see the star fill up
        setTimeout(() => onNext(rating), 300);
    };

    const displayValue = hoverValue !== null ? hoverValue : val;

    return (
        <div className="hope-drag-container">
            <div 
                className="flex justify-center items-center gap-2 md:gap-4 my-6"
                onMouseLeave={() => setHoverValue(null)}
            >
                {[1, 2, 3, 4, 5].map(starIndex => {
                    const fillValue = displayValue - starIndex + 1; // 1 if full, 0.5 if half, <=0 if empty
                    return (
                        <div key={starIndex} className="relative w-12 h-12 md:w-16 md:h-16 cursor-pointer touch-manipulation transform transition-transform hover:scale-110 active:scale-95">
                            {/* Left Half Hitbox (0.5) */}
                            <div 
                                className="absolute left-0 top-0 w-1/2 h-full z-10"
                                onClick={() => handleStarClick(starIndex - 0.5)}
                                onMouseEnter={() => setHoverValue(starIndex - 0.5)}
                                onTouchStart={() => setHoverValue(starIndex - 0.5)}
                            />
                            {/* Right Half Hitbox (1.0) */}
                            <div 
                                className="absolute right-0 top-0 w-1/2 h-full z-10"
                                onClick={() => handleStarClick(starIndex)}
                                onMouseEnter={() => setHoverValue(starIndex)}
                                onTouchStart={() => setHoverValue(starIndex)}
                            />
                            
                            {/* Empty Star Base */}
                            <svg viewBox="0 0 24 24" className="w-full h-full text-slate-200 transition-colors pointer-events-none">
                                <path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                            </svg>
                            
                            {/* Filled Star Overlay */}
                            {fillValue > 0 && (
                                <svg 
                                    viewBox="0 0 24 24" 
                                    className="absolute top-0 left-0 w-full h-full text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.6)] pointer-events-none"
                                    style={{ clipPath: fillValue === 0.5 ? 'inset(0 50% 0 0)' : 'none' }}
                                >
                                    <path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                                </svg>
                            )}
                        </div>
                    );
                })}
            </div>

            {/* MIDDLE: Rating Display */}
            <div className="flex-grow flex items-center justify-center my-4">
                <div className="rating-display-box shadow-sm border border-slate-100 bg-white scale-110">
                    <div className="rating-label text-slate-400">YOUR RATING</div>
                    <div className="rating-value">
                        <span className="number-val">{displayValue > 0 ? displayValue.toFixed(1) : "-.-"}</span> 
                        <span className="star-icon text-2xl">⭐</span>
                    </div>
                </div>
            </div>

            {/* BOTTOM: Text and Pill */}
            <div className="min-h-[140px] mt-2 flex flex-col items-center justify-end pointer-events-none">
                {currentQ.anchors && currentQ.anchors[displayValue.toFixed(1)] && (() => {
                    const fullText = currentQ.anchors[displayValue.toFixed(1)];
                    const match = fullText.match(/\(([^)]+)\)/);
                    const mainWord = match ? match[1] : fullText.split(':')[0].replace(/\d\s*Stars?/, '').trim();
                    const descriptionText = fullText.includes(':') ? fullText.split(':')[1].trim() : fullText;
                    return (
                        <div className="flex flex-col items-center w-full animate-fade-in">
                            <div className="px-8 py-2.5 mb-6 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-full text-lg md:text-xl text-white font-black tracking-[0.2em] shadow-[0_5px_15px_rgba(0,229,255,0.4)] uppercase whitespace-nowrap">

                                "{descriptionText}"
                            </div>
                        </div>
                    );
                })()}
            </div>
        </div>
    );
};


const HopeChart = ({ answers, surveyQuestions, isFinal }) => {

        useEffect(() => {
            setTimeout(() => setIsMounted(true), 100);
        }, []);

        const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: centerX + (radius * Math.cos(angleInRadians)),
                y: centerY + (radius * Math.sin(angleInRadians))
            };
        };

        const describeArc = (x, y, innerRadius, outerRadius, startAngle, endAngle) => {
            const startOut = polarToCartesian(x, y, outerRadius, endAngle);
            const endOut = polarToCartesian(x, y, outerRadius, startAngle);
            const startIn = polarToCartesian(x, y, innerRadius, endAngle);
            const endIn = polarToCartesian(x, y, innerRadius, startAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
            return [
                "M", startOut.x, startOut.y,
                "A", outerRadius, outerRadius, 0, largeArcFlag, 0, endOut.x, endOut.y,
                "L", endIn.x, endIn.y,
                "A", innerRadius, innerRadius, 0, largeArcFlag, 1, startIn.x, startIn.y,
                "Z"
            ].join(" ");
        };

        const cx = 500;
        const cy = 420; 
        const innerR = 180;

                                <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">

                                {/* 5-Star Rating Visualization */}
                                {[1, 2, 3, 4, 5].map(starIndex => {

                                    let fillPct = 0;

                                    // Total width of 5 stars + gaps = (5 * 24) + (4 * 6) = 120 + 24 = 144

                                            </svg>

                    <span className="bg-white px-3 py-1 rounded-full shadow-sm border border-slate-100 text-blue-600">{currentQIndex + 1} / {surveyQuestions.length}</span>
                </div>
                <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden shadow-inner">
                    <div className="bg-gradient-to-r from-emerald-400 via-blue-500 to-purple-500 h-full transition-all duration-700 ease-in-out" style={{ width: `${progress}%` }}></div>
                </div>
            </div>

            <div className="bg-white max-w-4xl w-full p-8 md:p-12 rounded-[2rem] shadow-2xl border border-slate-100 relative">
                
                <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 pb-6 border-b border-slate-100 gap-4">
                    <div>
                        <div className="inline-block bg-blue-50 text-blue-700 px-3 py-1 rounded-lg font-bold uppercase tracking-widest text-[10px] mb-3 border border-blue-100">{q.space}</div>
                        <div className="text-slate-400 font-bold text-sm tracking-wide">{q.dimension}</div>
                    </div>
                    {/* Removed avatar and audio from survey screen */}
                </div>

                <h2 className="text-4xl font-black text-slate-800 mb-6 tracking-tight leading-tight">{q.title}</h2>
                <div className="bg-slate-50 border-l-4 border-blue-500 p-6 rounded-r-2xl mb-10">
                    <p className="text-xl text-slate-700 leading-relaxed font-medium">{q.concept}</p>
                </div>
                
                {renderRater()}

                <div className="flex justify-between items-center mt-12 pt-8 border-t border-slate-100">
                    <button 
                        onClick={handlePrevQ}
                        className={`text-slate-500 font-bold hover:text-slate-800 px-6 py-3 transition-colors flex items-center gap-2 ${currentQIndex === 0 ? 'invisible' : ''}`}
>
                        <span>←</span> Back
                    </button>
                    {/* Next Question button removed as per user request */}
                </div>
            </div>
            
        
                </div>
                {/* Right Column - Results Display */}
                <div className="flex flex-col w-full lg:sticky lg:top-8 mt-12 lg:mt-0 lg:max-h-[calc(100vh-4rem)]">
                    <div className="absolute inset-0 pointer-events-none bg-[#02050a] rounded-3xl -z-10" style={{
                        backgroundImage: 'radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.08) 0%, transparent 60%), linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px)',
                        backgroundSize: '100% 100%, 30px 30px, 30px 30px',
                        backgroundPosition: 'center center'
                    }}></div>
                    <HopeChart answers={{...answers, [q.id]: currentSelection !== null ? currentSelection : 0.0}} surveyQuestions={surveyQuestions} isFinal={false} />
                </div>
            </div>
        </main>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
