const HopeSlider = ({ currentSelection, setCurrentSelection, currentQ, onNext, hoverValue, setHoverValue }) => {
    const val = currentSelection !== null ? currentSelection : 0.0;

    const handleStarClick = (rating) => {
        setCurrentSelection(rating);
        // Add a tiny delay before advancing so they can see the star fill up
        setTimeout(() => onNext(rating), 300);
    };

    const displayValue = hoverValue !== null ? hoverValue : val;

    return (
        <div className="hope-drag-container">
            <div 
                className="flex justify-center items-center gap-2 md:gap-4 my-1 md:my-2"
                onMouseLeave={() => setHoverValue(null)}
            >
                {[1, 2, 3, 4, 5].map(starIndex => {
                    const fillValue = displayValue - starIndex + 1; // 1 if full, 0.5 if half, <=0 if empty
                    return (
                        <div key={starIndex} className="relative w-12 h-12 md:w-16 md:h-16 cursor-pointer touch-manipulation transform transition-transform hover:scale-110 active:scale-95">
                            {/* Left Half Hitbox (0.5) */}
                            <div 
                                className="absolute left-0 top-0 w-1/2 h-full z-10"
                                onClick={() => handleStarClick(starIndex - 0.5)}
                                onMouseEnter={() => setHoverValue(starIndex - 0.5)}
                                onTouchStart={() => setHoverValue(starIndex - 0.5)}
                            />
                            {/* Right Half Hitbox (1.0) */}
                            <div 
                                className="absolute right-0 top-0 w-1/2 h-full z-10"
                                onClick={() => handleStarClick(starIndex)}
                                onMouseEnter={() => setHoverValue(starIndex)}
                                onTouchStart={() => setHoverValue(starIndex)}
                            />
                            
                            {/* Empty Star Base */}
                            <svg viewBox="0 0 24 24" className="w-full h-full text-slate-200 transition-colors pointer-events-none">
                                <path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                            </svg>
                            
                            {/* Filled Star Overlay */}
                            {fillValue > 0 && (
                                <svg 
                                    viewBox="0 0 24 24" 
                                    className="absolute top-0 left-0 w-full h-full text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.6)] pointer-events-none"
                                    style={{ clipPath: fillValue === 0.5 ? 'inset(0 50% 0 0)' : 'none' }}
                                >
                                    <path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                                </svg>
                            )}
                        </div>
                    );
                })}
            </div>



            {/* BOTTOM: Static Anchors */}
            <div className="grid grid-cols-3 gap-2 md:gap-4 mt-2 w-full items-start px-2 pointer-events-none">
                {["1.0", "3.0", "5.0"].map((key) => {
                    const fullText = currentQ.anchors && currentQ.anchors[key];
                    if (!fullText) return <div key={key}></div>;
                    
                    const match = fullText.match(/\(([^)]+)\)/);
                    const mainWord = match ? match[1] : fullText.split(':')[0].replace(/\d\s*Stars?/, '').trim();
                    const descriptionText = fullText.includes(':') ? fullText.split(':')[1].trim() : fullText;
                    
                    return (
                        <div key={key} className="flex flex-col items-center w-full">
                            <div className="px-3 py-1.5 md:px-5 md:py-2 mb-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-full text-[10px] md:text-xs font-black tracking-widest uppercase text-center shadow-sm">

                            </div>
                            <div className="text-[10px] md:text-xs text-slate-500 font-medium italic leading-relaxed text-center">
                                "{descriptionText}"
                            </div>
                        </div>
                    );

        </div>
    );
};


const HopeChart = ({ answers, surveyQuestions, isFinal }) => {
        const [isMounted, setIsMounted] = useState(false);

        useEffect(() => {
            setTimeout(() => setIsMounted(true), 100);
        }, []);

        const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: centerX + (radius * Math.cos(angleInRadians)),
                y: centerY + (radius * Math.sin(angleInRadians))
            };
        };

        const describeArc = (x, y, innerRadius, outerRadius, startAngle, endAngle) => {
            const startOut = polarToCartesian(x, y, outerRadius, endAngle);
            const endOut = polarToCartesian(x, y, outerRadius, startAngle);
            const startIn = polarToCartesian(x, y, innerRadius, endAngle);
            const endIn = polarToCartesian(x, y, innerRadius, startAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
            return [
                "M", startOut.x, startOut.y,
                "A", outerRadius, outerRadius, 0, largeArcFlag, 0, endOut.x, endOut.y,
                "L", endIn.x, endIn.y,
                "A", innerRadius, innerRadius, 0, largeArcFlag, 1, startIn.x, startIn.y,
                "Z"
            ].join(" ");
        };

                    <div className="absolute top-0 left-0 w-32 h-32 border-t border-l border-cyan-500/50 rounded-tl-3xl opacity-50"></div>
                    <div className="absolute top-0 right-0 w-32 h-32 border-t border-r border-cyan-500/50 rounded-tr-3xl opacity-50"></div>

                                const endA = startA + 8.5;

                                const scoreR = innerR + (displayScore / 5) * (maxOutR - innerR);

                                        <path d={scorePath} fill={color} filter="url(#glow-soft)" opacity={isMounted ? "0.9" : "0"} style={{ transition: `all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) ${delay}s` }} />

                                        )}

                                <text x="160" y="75" fill="#00e5ff" fontSize="18" fontWeight="bold" textAnchor="middle" opacity="0.9" letterSpacing="2px">{(totalScore / 20).toFixed(1)} / 5.0 STARS</text>

                                {/* 5-Star Rating Visualization */}
                                {[1, 2, 3, 4, 5].map(starIndex => {
                                    const score = totalScore / 20;
                                    let fillPct = 0;
                                    if (score >= starIndex) fillPct = 100;
                                    else if (score > starIndex - 1) fillPct = (score - (starIndex - 1)) * 100;
                                    // Total width of 5 stars + gaps = (5 * 24) + (4 * 6) = 120 + 24 = 144
                                    // Start X = 160 - (144 / 2) = 88
                                    const starX = 88 + ((starIndex - 1) * 30);
                                    return (
                                        <g key={starIndex} transform={`translate(${starX}, 90)`}>
                                            <svg viewBox="0 0 24 24" width="24" height="24">
                                                <path fill="#1e293b" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                                            </svg>
                                            {fillPct > 0 && (
                                                <svg viewBox="0 0 24 24" width="24" height="24">
                                                    <path fill="#facc15" clipPath={`url(#clip-star-${starIndex})`} d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" filter="url(#glow-yellow)" />
                                                </svg>
                                            )}
                                        </g>
                                    );

                                <text x="160" y="145" fill="#00e5ff" fontSize="12" fontWeight="bold" textAnchor="middle" opacity="0.7" letterSpacing="1px">{Math.round(totalScore)}% HoPE CAPACITY</text>
                            </g>
                            
                            <path d={`M ${cx - 80} ${cy + 160} L ${cx - 80} ${cy + 190} L ${cx - 240} ${cy + 190} L ${cx - 240} ${cy + 230}`} fill="none" stroke="#00e5ff" strokeWidth="2" opacity={isMounted ? "0.4" : "0"} filter="url(#glow-soft)" style={{ transition: 'opacity 1s ease 0.5s' }} />

                        </svg>
                    </div>

                    <div className={`mt-1 md:mt-2 shrink-0 border border-cyan-500/30 rounded-2xl bg-[#03060d]/80 p-2 md:p-3 relative shadow-[inset_0_0_30px_rgba(0,229,255,0.02)] transition-opacity duration-1000 ${isMounted ? 'opacity-100 delay-[500ms]' : 'opacity-0'}`}>

                        <div className="absolute bottom-0 right-0 w-6 h-6 border-b-2 border-r-2 border-cyan-400 rounded-br-2xl"></div>
                        
                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-[#050a14] px-3 py-0.5 text-cyan-300 text-[9px] md:text-xs font-bold tracking-[0.15em] uppercase border border-cyan-500/50 rounded-full shadow-[0_0_15px_rgba(0,229,255,0.4)] whitespace-nowrap">
                            Population-Specific Context

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2 pt-2 pb-1">

                                        {[0,1,2,3,4,5].map(tick => {
                                            const a = -120 + (tick / 5) * 240;
                                            const p1 = polarToCartesian(50, 50, 42, a);
                                            const p2 = polarToCartesian(50, 50, 46, a);
                                            return <line key={tick} x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke="#00e5ff" strokeWidth="2" opacity="0.6"/>;
                                        })}
                                        <path d={describeArc(50, 50, 36, 40, -120, 120)} fill="#0a1526" stroke="#00e5ff" strokeWidth="0.5" opacity="0.5" />
                                        <path d={describeArc(50, 50, 36, 40, -120, -120 + (flex1Score / 5) * 240)} fill="#00e5ff" filter="url(#glow-soft)" style={{ transition: 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)' }} />
                                        <g style={{ transform: `rotate(${-120 + (flex1Score / 5) * 240}deg)`, transformOrigin: '50px 50px', transition: 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)' }}>
                                            <polygon points="48.5,50 51.5,50 50,12" fill="#ffffff" filter="url(#glow-soft)" />

                                    </svg>
                                    <div className="absolute -bottom-2 left-1/2 -translate-x-1/2 text-cyan-400 font-bold text-xs bg-[#03060d] px-2 rounded-full border border-cyan-500/20">{flex1Score.toFixed(1)}</div>
                                </div>
                                <div className="max-w-[160px]">
                                    <h3 className="text-white font-bold text-[10px] md:text-sm leading-tight mb-1">GANG DE-IDENTIFICATION</h3>
                                </div>
                            </div>
                            <div className="flex items-center gap-3 justify-center border-t md:border-t-0 md:border-l border-cyan-500/20 pt-3 md:pt-0 md:pl-3">
                                <div className="relative w-16 h-16 shrink-0">
                                    <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-[0_0_12px_rgba(0,229,255,0.3)]">
                                        {[0,1,2,3,4,5].map(tick => {
                                            const a = -120 + (tick / 5) * 240;
                                            const p1 = polarToCartesian(50, 50, 42, a);
                                            const p2 = polarToCartesian(50, 50, 46, a);
                                            return <line key={tick} x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke="#00e5ff" strokeWidth="2" opacity="0.6"/>;
                                        })}
                                        <path d={describeArc(50, 50, 36, 40, -120, 120)} fill="#0a1526" stroke="#00e5ff" strokeWidth="0.5" opacity="0.5" />
                                        <path d={describeArc(50, 50, 36, 40, -120, -120 + (flex2Score / 5) * 240)} fill="#00e5ff" filter="url(#glow-soft)" style={{ transition: 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)' }} />
                                        <g style={{ transform: `rotate(${-120 + (flex2Score / 5) * 240}deg)`, transformOrigin: '50px 50px', transition: 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)' }}>
                                            <polygon points="48.5,50 51.5,50 50,12" fill="#ffffff" filter="url(#glow-soft)" />
                                            <circle cx="50" cy="50" r="5" fill="#00e5ff" stroke="#ffffff" strokeWidth="1.5" />
                                        </g>
                                    </svg>
                                    <div className="absolute -bottom-2 left-1/2 -translate-x-1/2 text-cyan-400 font-bold text-xs bg-[#03060d] px-2 rounded-full border border-cyan-500/20">{flex2Score.toFixed(1)}</div>
                                </div>
                                <div className="max-w-[160px]">
                                    <h3 className="text-white font-bold text-[10px] md:text-sm leading-tight mb-1">PSYCHOLOGICAL SAFETY</h3>
                                </div>
                            </div>
                        </div>
                    </div>

                    {isFinal && (
                        <div className={`shrink-0 flex flex-col sm:flex-row gap-4 mt-8 justify-center transition-opacity duration-1000 ${isMounted ? 'opacity-100 delay-[1000ms]' : 'opacity-0'}`}>
                            <button onClick={() => window.print()} className="px-8 py-4 bg-transparent border-2 border-cyan-500/50 text-cyan-400 font-bold rounded-full hover:bg-cyan-500/10 hover:border-cyan-400 hover:text-cyan-300 transition-all shadow-[0_0_20px_rgba(0,229,255,0.1)] hover:shadow-[0_0_30px_rgba(0,229,255,0.3)] tracking-wide uppercase text-sm">
                                Export PDF Report

                    )}
                </div>
        );
};

const App = () => {
    const [step, setStep] = useState('intro'); // 'intro', 'survey', 'results'
    const [currentQIndex, setCurrentQIndex] = useState(0);
    const [answers, setAnswers] = useState({}); // { id: score }
    const [currentSelection, setCurrentSelection] = useState(null);
    const [hoverValue, setHoverValue] = useState(null);

    const handleNextQ = (val) => {
        const finalVal = val !== undefined ? val : (currentSelection !== null ? currentSelection : 0.0);
        const qId = surveyQuestions[currentQIndex].id;
        const newAnswers = { ...answers, [qId]: finalVal };
        setAnswers(newAnswers);
        
        if (currentQIndex < surveyQuestions.length - 1) {
            setCurrentQIndex(currentQIndex + 1);
            setCurrentSelection(newAnswers[surveyQuestions[currentQIndex + 1].id] ?? null);
            window.scrollTo(0,0);
        } else {
            setStep('results');
            window.scrollTo(0,0);
        }
    };

    const handlePrevQ = () => {
        if (currentQIndex> 0) {
            setCurrentQIndex(currentQIndex - 1);
            setCurrentSelection(answers[surveyQuestions[currentQIndex - 1].id] ?? null);
            window.scrollTo(0,0);
        } else {
            setStep('intro');
        }
    };

    const renderRater = () => {
        return (

                    currentSelection={currentSelection !== null ? currentSelection : 0.0} 
                    setCurrentSelection={setCurrentSelection}

                        <div className="bg-blue-50 border border-blue-100 p-6 rounded-2xl shadow-sm">

                            </h3>
                            <p className="text-base text-blue-800">Imagine you are a professional critic writing a review for a hotel or an app. You are not rating your worth as a human being. Instead, you are rating the quality of the experience currently provided by the different "facilities" and "services" in your life.</p>
                        </div>
                    </div>

                    <button 
                        onClick={() => { 
                            setStep('survey'); 
                            setCurrentSelection(answers[surveyQuestions[0].id] ?? null);

                        className="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-10 py-5 rounded-full font-bold text-xl hover:-translate-y-1 transition-all shadow-xl hover:shadow-[0_10px_25px_rgba(79,70,229,0.4)] inline-flex items-center justify-center gap-3 w-full md:w-auto"
>
                        Let's Begin →

                    <button 
                        onClick={() => handleNextQ()}
                        className="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-8 py-3 rounded-full font-bold text-lg hover:-translate-y-1 transition-all shadow-md hover:shadow-[0_5px_15px_rgba(79,70,229,0.4)] flex items-center gap-2"
                    >
                        {currentQIndex === surveyQuestions.length - 1 ? 'Submit' : 'Next'} <span>→</span>
                    </button>
                </div>
            </div>
            
        
                </div>
                {/* Right Column - Results Display */}
                <div className="flex flex-col w-full h-full relative rounded-3xl shadow-2xl">
                    <div className="absolute inset-0 pointer-events-none bg-[#02050a] rounded-3xl -z-10" style={{
                        backgroundImage: 'radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.08) 0%, transparent 60%), linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px)',
                        backgroundSize: '100% 100%, 30px 30px, 30px 30px',
                        backgroundPosition: 'center center'
                    }}></div>
                    <HopeChart answers={{...answers, [q.id]: currentSelection !== null ? currentSelection : 0.0}} surveyQuestions={surveyQuestions} isFinal={false} />
                </div>
            </div>
        </main>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
