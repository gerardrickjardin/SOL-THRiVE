        const elevenLabsApiKey = "sk_d2fc2ac281afdb8a56178f44c8ebca76f21da62f7a256bf8";
        const elevenLabsVoiceId = "4EfJOraSN0d4Lt6iDXwh";

        let currentAudio = null;

        async function playAudio(text, btnElement, avatarId = null) {
            if (!elevenLabsApiKey) {
                alert("Developer Note: Please add your ElevenLabs API key to the 'elevenLabsApiKey' variable in the code.");
                return;
            }

            const voiceId = elevenLabsVoiceId || '21m00Tcm4TlvDq8ikWAM';
            const originalText = btnElement.innerText;
            const avatarContainer = avatarId ? document.getElementById(`${avatarId}-container`) : null;
            const avatarImg = avatarId ? document.getElementById(`${avatarId}-img`) : null;
            const avatarVid = avatarId ? document.getElementById(`${avatarId}-vid`) : null;
            
            btnElement.classList.add('animate-pulse');
            btnElement.innerText = "⏳";
            if (avatarContainer) avatarContainer.classList.add('avatar-talking');

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'audio/mpeg',
                        'xi-api-key': elevenLabsApiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_monolingual_v1",
                        voice_settings: { stability: 0.5, similarity_boost: 0.5 }
                    })
                });

                if (!response.ok) throw new Error("Audio generation failed. Check your API key.");
                
                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                
                if (currentAudio) {
                    currentAudio.pause();
                }
                
                currentAudio = new Audio(audioUrl);
                currentAudio.onended = () => {
                    btnElement.innerText = originalText;
                    btnElement.classList.remove('animate-pulse');
                    if (avatarContainer) avatarContainer.classList.remove('avatar-talking');
                    if (avatarImg && avatarVid) {
                        avatarImg.style.opacity = '1';
                        avatarVid.style.opacity = '0';
                        avatarVid.pause();
                        avatarVid.currentTime = 0;
                    }
                };

                if (avatarImg && avatarVid) {
                    avatarImg.style.opacity = '0';
                    avatarVid.style.opacity = '1';
                    avatarVid.play().catch(e => console.error("Video play failed:", e));
                }

                currentAudio.play();
                btnElement.innerText = "🔊";
                btnElement.classList.remove('animate-pulse');

            } catch (error) {
                console.error(error);
                alert("Failed to generate audio. Make sure your ElevenLabs API key is correct.");
                btnElement.innerText = originalText;
                btnElement.classList.remove('animate-pulse');
                if (avatarContainer) avatarContainer.classList.remove('avatar-talking');
                if (avatarImg && avatarVid) {
                    avatarImg.style.opacity = '1';
                    avatarVid.style.opacity = '0';
                    avatarVid.pause();
                    avatarVid.currentTime = 0;
                }
            }
        }
    </script>

});

const HopeSlider = ({ currentSelection, setCurrentSelection, currentQ }) => {
    const scaleValues = [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0];
    const [isHovered, setIsHovered] = useState(false);
    
    const val = currentSelection !== null ? currentSelection : 2.5;

    // Calculate tooltip position
    const min = 0;
    const max = 5;
    const percent = ((val - min) / (max - min)) * 100;
    const thumbWidthAdjustment = 13 - (percent * 0.26); 
    const tooltipLeft = `calc(${percent}% + ${thumbWidthAdjustment}px)`;

    let dataKey = currentQ.title.startsWith("Flex 1") ? "Flex1" : (currentQ.title.startsWith("Flex 2") ? "Flex2" : currentQ.title.split(' ')[0]);
    let valStr = val.toFixed(1);

    // PRELOADER: Smoothly fetch all 11 images for this specific question into browser cache
    useEffect(() => {
        if (generatedData[dataKey]) {
            Object.values(generatedData[dataKey]).forEach(url => {
                const img = new Image();
                img.src = url;
            });
        }
    }, [dataKey]);

    let imgUrl = generatedData[dataKey] && generatedData[dataKey][valStr] 
        ? generatedData[dataKey][valStr] 
        : `https://placehold.co/300x200/cccccc/333333?text=Error`;

    return (
        <div className="hope-drag-container">
            <div className="slider-track-wrapper">
                <div 
                    className={`drag-tooltip ${isHovered ? 'active' : ''}`} 
                    style={{ left: tooltipLeft }}
                >
                    <img className="tooltip-img" src={imgUrl} alt="Guide" />
                </div>
                <input 
                    type="range" 
                    className="hope-range-slider" 
                    min="0" max="5" step="0.5" 
                    value={val} 
                    onChange={(e) => setCurrentSelection(parseFloat(e.target.value))}
                    onMouseEnter={() => setIsHovered(true)}
                    onMouseLeave={() => setIsHovered(false)}
                    onTouchStart={() => setIsHovered(true)}
                    onTouchEnd={() => setIsHovered(false)}
                />
            </div>
            <div className="ticks-container">
                {scaleValues.map(tickVal => (
                    <div key={tickVal} className="tick-mark">
                        <span>{tickVal.toFixed(1)}</span>
                    </div>
                ))}
            </div>

            {/* Rating Display */}
            <div className="rating-display-box">
                <div className="rating-label">YOUR RATING</div>
                <div className="rating-value">
                    <span className="number-val">{val.toFixed(1)}</span> 
                    <span className="star-icon">⭐</span>
                </div>
            </div>
        </div>
    );
};

const ResultsScreen = ({ answers, surveyQuestions }) => {

        useEffect(() => {
            // Trigger entrance animations
            setTimeout(() => setIsMounted(true), 100);
            
            // Animate each slice to its final score

            surveyQuestions.forEach((q, i) => {
                setTimeout(() => {
                    setAnimatedScores(prev => ({...prev, [q.id]: answers[q.id] ?? 0}));
                }, i * 50); // cascading animation
            });
        }, [answers]);

        // Define polar-to-cartesian and arc generator for React SVG
        const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: centerX + (radius * Math.cos(angleInRadians)),
                y: centerY + (radius * Math.sin(angleInRadians))
            };
        };

        const describeArc = (x, y, innerRadius, outerRadius, startAngle, endAngle) => {
            const startOut = polarToCartesian(x, y, outerRadius, endAngle);
            const endOut = polarToCartesian(x, y, outerRadius, startAngle);
            const startIn = polarToCartesian(x, y, innerRadius, endAngle);
            const endIn = polarToCartesian(x, y, innerRadius, startAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
            return [
                "M", startOut.x, startOut.y,
                "A", outerRadius, outerRadius, 0, largeArcFlag, 0, endOut.x, endOut.y,
                "L", endIn.x, endIn.y,
                "A", innerRadius, innerRadius, 0, largeArcFlag, 1, startIn.x, startIn.y,

                                src="minds-eye-white-bg.mp4"
                                playsInline muted loop
                                className="w-full h-full object-cover scale-110 absolute top-0 left-0 transition-opacity duration-300 pointer-events-none"
                                style={{ opacity: 0 }}
                            ></video>
                        </div>
                        <button 
                            onClick={(e) => window.playAudio("Welcome to the HoPE Index. This is not a test, an academic exam, or a clinical trial designed to diagnose your flaws. It is an innovative, highly visual platform designed to map where you are today and provide a clear, actionable guide toward a life of true optimization and stability. Imagine you are a professional critic writing a review for a hotel or an app. You are not rating your worth as a human being. Instead, you are rating the quality of the experience currently provided by the different facilities and services in your life.", e.currentTarget, 'avatar-intro')} 
                            className="text-lg p-2 bg-slate-50 rounded-full hover:bg-blue-50 hover:text-blue-600 transition-all shadow-sm border border-slate-200 flex items-center justify-center" 
                            title="Read Aloud"
                        >
                            🔊
                        </button>
                    </div>

                    <h1 className="text-5xl font-black text-slate-800 mb-6 tracking-tight">The HoPE Index</h1>
                    <h2 className="text-xl font-bold text-slate-500 mb-8 uppercase tracking-widest">Human Optimal Personal Experience</h2>
                    
                    <div className="text-left space-y-6 text-slate-600 text-lg leading-relaxed mb-10">
                        <p>Welcome to the HoPE Index. This is not a test, an academic exam, or a clinical trial designed to diagnose your flaws. It is an innovative, highly visual platform designed to map where you are today and provide a clear, actionable guide toward a life of true optimization and stability.</p>
                        
                        <div className="bg-blue-50 border border-blue-100 p-6 rounded-2xl shadow-sm">
                            <h3 className="font-bold text-blue-900 mb-2 flex items-center gap-2">
                                <span className="text-xl">💡</span> How to Complete this Survey
                            </h3>
                            <p className="text-base text-blue-800">Imagine you are a professional critic writing a review for a hotel or an app. You are not rating your worth as a human being. Instead, you are rating the quality of the experience currently provided by the different "facilities" and "services" in your life.</p>
                        </div>
                    </div>

                    <button 
                        onClick={() => { 
                            if (window.currentAudio) window.currentAudio.pause();
                            setStep('survey'); 
                            setCurrentSelection(answers[surveyQuestions[0].id] ?? 2.5); 
                        }}
                        className="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-10 py-5 rounded-full font-bold text-xl hover:-translate-y-1 transition-all shadow-xl hover:shadow-[0_10px_25px_rgba(79,70,229,0.4)] inline-flex items-center justify-center gap-3 w-full md:w-auto"
                    >
                        Begin Assessment →
                    </button>
                </div>
            </main>
        );
    }

    // --- RESULTS SCREEN ---
    if (step === 'results') {
        return <ResultsScreen answers={answers} surveyQuestions={surveyQuestions} />;
    }

    // --- SURVEY SCREEN ---
    const q = surveyQuestions[currentQIndex];
    const progress = ((currentQIndex) / surveyQuestions.length) * 100; // Progress starts at 0

    return (
        <main className="flex-grow p-4 md:p-8 flex flex-col items-center">
            
            <div className="w-full max-w-4xl mb-10">
                <div className="flex justify-between items-end text-sm font-bold text-slate-500 mb-3">
                    <span className="uppercase tracking-widest text-xs">Survey Progress</span>
                    <span className="bg-white px-3 py-1 rounded-full shadow-sm border border-slate-100 text-blue-600">{currentQIndex + 1} / {surveyQuestions.length}</span>
                </div>
                <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden shadow-inner">
                    <div className="bg-gradient-to-r from-emerald-400 via-blue-500 to-purple-500 h-full transition-all duration-700 ease-in-out" style={{ width: `${progress}%` }}></div>
                </div>
            </div>

            <div className="bg-white max-w-4xl w-full p-8 md:p-12 rounded-[2rem] shadow-2xl border border-slate-100 relative">
                
                <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 pb-6 border-b border-slate-100 gap-4">
                    <div>
                        <div className="inline-block bg-blue-50 text-blue-700 px-3 py-1 rounded-lg font-bold uppercase tracking-widest text-[10px] mb-3 border border-blue-100">{q.space}</div>
                        <div className="text-slate-400 font-bold text-sm tracking-wide">{q.dimension}</div>
                    </div>
                    <div className="flex items-center gap-3">
                        <div id={`avatar-survey-${currentQIndex}-container`} className="relative w-28 h-28 rounded-full shadow-lg border-[3px] border-slate-100 bg-white overflow-hidden flex-shrink-0">
                            <img 
                                id={`avatar-survey-${currentQIndex}-img`}
                                src="minds-eye.png"
                                alt="Mind's Eye"
                                className="w-full h-full object-contain absolute top-0 left-0 transition-opacity duration-300"
                                style={{ opacity: 1 }}
                            />
                            <video 
                                id={`avatar-survey-${currentQIndex}-vid`}
                                src="minds-eye-white-bg.mp4"
                                playsInline muted loop
                                className="w-full h-full object-cover scale-110 absolute top-0 left-0 transition-opacity duration-300 pointer-events-none"
                                style={{ opacity: 0 }}
                            ></video>
                        </div>
                        <button 
                            onClick={(e) => window.playAudio(`${q.dimension}. ${q.title}. ${q.concept}`, e.currentTarget, `avatar-survey-${currentQIndex}`)} 
                            className="text-sm p-2 h-10 w-10 bg-slate-50 rounded-full hover:bg-blue-50 hover:text-blue-600 transition-all shadow-sm border border-slate-200 flex items-center justify-center flex-shrink-0" 
                            title="Read Aloud"
                        >
                            🔊
                        </button>
                    </div>
                </div>

                <h2 className="text-4xl font-black text-slate-800 mb-6 tracking-tight leading-tight">{q.title}</h2>
                <div className="bg-slate-50 border-l-4 border-blue-500 p-6 rounded-r-2xl mb-10">
                    <p className="text-xl text-slate-700 leading-relaxed font-medium">{q.concept}</p>
                </div>
                
                {renderRater()}

                <div className="flex justify-between items-center mt-12 pt-8 border-t border-slate-100">
                    <button 
                        onClick={handlePrevQ}
                        className={`text-slate-500 font-bold hover:text-slate-800 px-6 py-3 transition-colors flex items-center gap-2 ${currentQIndex === 0 ? 'invisible' : ''}`}
                    >
                        <span>←</span> Back
                    </button>
                    <button 
                        onClick={handleNextQ}
                        className={`px-10 py-4 rounded-full font-bold text-lg transition-all flex items-center gap-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white hover:-translate-y-1 hover:shadow-[0_10px_25px_rgba(79,70,229,0.4)] cursor-pointer shadow-lg`}
                    >
                        {currentQIndex === surveyQuestions.length - 1 ? 'Generate Index Map 🚀' : 'Next Question →'}
                    </button>
                </div>
            </div>
            
        </main>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
