// --- API & TTS HELPERS ---

// This function cleans up text specifically so AI voices read it with natural inflection.
function prepareTextForTTS(text) {
  return text
    .replace(/THRiVE/g, "Thrive") // Fix pronunciation of branding
    .replace(/\(([^)]+)\)/g, ", $1,") // Convert (parentheses) to commas to prevent unnatural pitch drops
    .replace(/([.!?])\s+/g, "$1 <break time=\"0.8s\" /> "); // Add natural 0.8s breathing pauses
}

async function cleanTextWithGemini(text) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
  const payload = {
    contents: [{ parts: [{ text: `Organize the following dictated text into clear bullet points. Remove conversational filler words (like "ums", "ahs", "OK great", "yeah", "I would say", "basically", etc.) and clean up the phrasing so it reads professionally and directly. Do NOT remove any core details or stories. Format it into a clean, bulleted list for maximum readability. Text:\n\n${text}` }] }],
    systemInstruction: { parts: [{ text: "You are a helpful assistant. Return ONLY the bullet points. Each point must start with a standard bullet character (•). Strip out conversational cruft and ensure the output is polished and direct, preserving the core meaning." }] }
  };

  const delays = [1000, 2000, 4000, 8000, 16000];
  for (let i = 0; i < 5; i++) {
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error('API Error');
      const data = await response.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || text;
    } catch (err) {
      if (i === 4) return "• " + text.split('. ').join('.\n• '); // Fallback formatting
      await new Promise(r => setTimeout(r, delays[i]));
    }
  }
}

function ChatSection({ section, stepNumber, initialDraft, elevenLabsKey, elevenLabsVoiceId, onComplete, onBack }) {
  const [draft, setDraft] = useState('');
  const [chatState, setChatState] = useState('initial'); // 'initial', 'digging', 'cleaning', 'approval'
  const [isListening, setIsListening] = useState(false);
  const [isSpeaking, setIsSpeaking] = useState(false);
  const recognitionRef = useRef(null);
  const textAreaRef = useRef(null);
  const audioRef = useRef(null);

  // Reset state when section changes or populate if going backward
  useEffect(() => {
    setDraft(initialDraft);
    // If they go back and already have a clean draft, jump straight to the approval state
    setChatState(initialDraft ? 'approval' : 'initial'); 
    setIsListening(false);
    setIsSpeaking(false);
    if (audioRef.current) {
      audioRef.current.pause();
      audioRef.current = null;
    }
    window.speechSynthesis.cancel();
    if (recognitionRef.current) {
      recognitionRef.current.stop();
    }
  }, [section, initialDraft]);

  // Speech Recognition Setup
  useEffect(() => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      
      recognition.onresult = (event) => {
        let finalTranscript = '';
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }
        
        // Append final transcript
        if (finalTranscript) {
          setDraft(prev => (prev + ' ' + finalTranscript).trim());
        }
      };

      recognition.onerror = (e) => {
        console.error("Speech Recognition Error", e);
        setIsListening(false);
      };

      recognition.onend = () => {
        setIsListening(false);
      };

      recognitionRef.current = recognition;
    }
    
    return () => {
      if (recognitionRef.current) recognitionRef.current.stop();
      window.speechSynthesis.cancel();
    };
  }, []);

  const toggleListen = () => {
    if (!recognitionRef.current) {
      alert("Dictation is not supported in this browser. Please type your answers.");
      return;
    }
    
    if (isListening) {
      recognitionRef.current.stop();
    } else {
      recognitionRef.current.start();
      setIsListening(true);
      if (textAreaRef.current) textAreaRef.current.focus();
    }
  };

  const handlePreSubmit = () => {
    if (draft.trim().length === 0) return;
    
    // Digging Deeper Logic: If text is relatively short, push back
    if (draft.length < 80 && chatState === 'initial') {
      setChatState('digging');
    } else {
      handleCleanUp();
    }
  };

  const handleCleanUp = async () => {
    setChatState('cleaning');
    const cleaned = await cleanTextWithGemini(draft);
    setDraft(cleaned);
    setChatState('approval');
  };

  const fallbackTTS = () => {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(section.prompt);
    utterance.onend = () => setIsSpeaking(false);
    window.speechSynthesis.speak(utterance);
  };

  const handleSpeakPrompt = async () => {
    if (isSpeaking) {
      setIsSpeaking(false);
      if (audioRef.current) {
        audioRef.current.pause();
      }
      window.speechSynthesis.cancel();
      return;
    }

    setIsSpeaking(true);
    
    const apiKeyToUse = elevenLabsKey ? elevenLabsKey.trim() : "";
    const voiceIdToUse = elevenLabsVoiceId && elevenLabsVoiceId.trim() !== "" ? elevenLabsVoiceId.trim() : "21m00Tcm4TlvDq8ikWAM";

    // Apply our TTS formatting to ensure natural breathing and pacing
    const textWithPauses = prepareTextForTTS(section.prompt);

    if (apiKeyToUse) {
      try {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceIdToUse}`, {
          method: 'POST',
          headers: {
            'Accept': 'audio/mpeg',
            'xi-api-key': apiKeyToUse,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            text: textWithPauses,
            model_id: 'eleven_turbo_v2_5', 
            voice_settings: { stability: 0.5, similarity_boost: 0.75 }
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => null);
          const errMsg = errData?.detail?.message || `HTTP error ${response.status}`;
          throw new Error(errMsg);
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        audioRef.current = new Audio(url);
        audioRef.current.onended = () => setIsSpeaking(false);
        
        try {
          await audioRef.current.play();
        } catch (playError) {
          console.warn("Audio playback prevented by browser:", playError);
          fallbackTTS();
        }

      } catch (error) {
        console.warn("ElevenLabs TTS failed, using standard voice fallback."); // Cleaned up the console log so it doesn't look like a critical crash
        fallbackTTS(); // Fallback if API fails
      }
    } else {
      fallbackTTS(); // Fallback if no API key is provided
    }
  };

  const isCleaning = chatState === 'cleaning';
  
  // Calculate items to enforce the "At least 3" rule
  const bulletCount = (draft.match(/•/g) || []).length;
  const hasEnoughItems = bulletCount >= 3;

  return (
    <div className="space-y-6 animate-in fade-in duration-500 relative print:hidden">
      <div className="text-center mb-8 border-b border-slate-100 pb-4">
        <span className="text-slate-400 text-xs md:text-sm uppercase tracking-widest font-black">{section.title.split(' ')[0]}: Step {stepNumber} of 6</span>
      </div>

      {/* Primary AI Prompt */}
      <div className="flex gap-4 items-start">
        <div className={`w-10 h-10 md:w-12 md:h-12 bg-slate-900 rounded-full flex items-center justify-center text-white shrink-0 shadow-md text-xl md:text-2xl`}>
          {section.icon}
        </div>
        <div className="bg-slate-50 border border-slate-200 rounded-2xl rounded-tl-none p-4 md:p-6 text-slate-700 leading-relaxed shadow-sm flex-1 overflow-hidden">
          <div className="flex items-start justify-between gap-4">
            <div className="flex-1 w-full overflow-hidden">
              {section.content ? section.content : <p className="text-slate-800 text-lg mb-2">{section.prompt}</p>}
            </div>
            <button 
              onClick={handleSpeakPrompt}
              className={`shrink-0 p-2 rounded-full transition-colors ${isSpeaking ? 'bg-blue-100 text-blue-600' : 'text-slate-400 hover:text-blue-600 hover:bg-blue-50'}`}
              title={isSpeaking ? "Stop Reading" : "Read Aloud"}
            >
              <SpeakerIcon className="w-5 h-5" />
            </button>
          </div>
        </div>
      </div>

      {/* Digging Deeper AI Prompt */}
      {chatState === 'digging' && (
        <div className="flex gap-4 items-start mt-6 animate-in slide-in-from-bottom-4 fade-in duration-300">
          <div className="w-10 h-10 md:w-12 md:h-12 bg-emerald-500 rounded-full flex items-center justify-center text-white shrink-0 shadow-md">
            <SparkleIcon className="w-5 h-5 md:w-6 md:h-6" />
          </div>
          <div className="bg-emerald-50 border border-emerald-100 rounded-2xl rounded-tl-none p-4 md:p-6 text-emerald-900 leading-relaxed shadow-sm">
            <p className="font-bold mb-1 text-lg">That's a great start! 🌟</p>
            <p>But I want to know a little bit more. Tell me a quick story, or give me a specific example. Tap the mic and just let the thoughts flow!</p>
          </div>
        </div>
      )}

      {/* Interaction Area */}
      <div className="mt-8 relative">
        {chatState === 'approval' && (
          <div className={`flex items-center gap-2 mb-3 font-bold text-xs md:text-sm uppercase tracking-widest animate-in fade-in ${hasEnoughItems ? 'text-emerald-600' : 'text-amber-600'}`}>
            {hasEnoughItems ? (
              <>
                <CheckIcon className="w-5 h-5" />
                <span>Text organized! How does this look?</span>
              </>
            ) : (
              <>
                <span className="text-lg">⚠️</span>
                <span>Almost there! We only found {bulletCount} item{bulletCount === 1 ? '' : 's'}. We need at least 3 (but 5 is ideal!)</span>
              </>
            )}
          </div>
        )}

        <textarea 
          ref={textAreaRef}
          rows={chatState === 'approval' ? 8 : 6} 
          className={`w-full border-2 rounded-2xl p-4 md:p-5 pb-16 outline-none transition-all text-slate-700 leading-relaxed resize-none text-base md:text-lg
            ${chatState === 'approval' 
              ? (hasEnoughItems ? 'border-emerald-300 bg-emerald-50/50 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100' : 'border-amber-300 bg-amber-50/50 focus:border-amber-500 focus:ring-4 focus:ring-amber-100')
              : 'border-slate-200 bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-50'
            }
            ${isCleaning ? 'opacity-50 pointer-events-none' : ''}
          `}
          placeholder={chatState === 'approval' ? "Feel free to manually edit this text..." : "Tap the microphone icon to start talking or start typing here..."}
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
        ></textarea>
        
        {/* Floating Dictation Button */}
        {chatState !== 'approval' ? (
          <button 
            onClick={toggleListen}
            disabled={isCleaning}
            className={`absolute bottom-4 left-4 rounded-full p-3 transition-all flex items-center justify-center shadow-md border 
              ${isListening 
                ? 'bg-red-500 text-white border-red-600 animate-pulse' 
                : 'bg-blue-50 text-blue-600 border-blue-200 hover:bg-blue-100 hover:text-blue-700'
              }
            `}
            title="Toggle Dictation"
          >
            {isListening ? <StopMicIcon className="w-6 h-6" /> : <MicIcon className="w-6 h-6" />}
          </button>
        ) : (
          <button 
            onClick={() => setChatState('initial')}
            className="absolute bottom-4 left-4 bg-slate-900 text-white hover:bg-slate-800 rounded-full p-3 transition-all flex items-center justify-center shadow-md"
            title="Edit / Add More Details"
          >
            <MicIcon className="w-6 h-6" />
          </button>
        )}
      </div>

      {/* Action Buttons */}
      <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mt-6 w-full">
        {/* Back Button & Admin Skip */}
        <div className="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
          <button 
            onClick={onBack}
            className="w-full sm:w-auto text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl font-bold transition-all px-6 py-3 flex items-center justify-center gap-2"
          >
            <ArrowLeftIcon className="w-5 h-5" /> Back
          </button>
          
          {/* TEMPORARY ADMIN BUTTON */}
          <button 
            onClick={() => onComplete(draft || "• Admin Skipped 1\n• Admin Skipped 2\n• Admin Skipped 3")}
            className="w-full sm:w-auto text-rose-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl font-bold transition-all px-4 py-3 flex items-center justify-center text-xs uppercase tracking-widest"
            title="Skip this section for testing"
          >
            Admin Skip ⏩
          </button>
        </div>

        {/* Primary Actions */}
        <div className="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto">
          {chatState === 'approval' ? (
            <>
               <div className={`text-sm italic ${hasEnoughItems ? 'text-slate-500' : 'text-amber-600 font-bold'}`}>
                {hasEnoughItems ? 'Tap the mic to add more details!' : 'Tap the mic to add more items to reach 3!'}
              </div>
              <button 
                onClick={() => onComplete(draft)}
                disabled={!hasEnoughItems}
                className={`w-full sm:w-auto text-white rounded-full font-bold transition-all px-8 py-4 shadow-md flex items-center justify-center gap-2 text-lg
                  ${hasEnoughItems ? 'bg-blue-600 hover:bg-blue-700 hover:shadow-lg' : 'bg-slate-400 cursor-not-allowed opacity-70'}
                `}
              >
                Approve & Continue <CheckIcon className="w-5 h-5" />
              </button>
            </>
          ) : (
            <>
              {(draft.length > 0 || chatState === 'digging') && (
                <button 
                  onClick={handleCleanUp}
                  disabled={isCleaning || draft.trim() === ''}
                  className="w-full sm:w-auto bg-slate-900 hover:bg-slate-800 text-white rounded-full font-bold transition-all px-6 py-4 shadow-md flex items-center justify-center gap-2 disabled:opacity-50 text-lg"
                >
                  {isCleaning ? '✨ Organizing...' : '✨ Clean Up Text'}
                </button>
              )}

              <button 
                onClick={handlePreSubmit}
                disabled={draft.trim().length === 0 || isCleaning}
                className="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white rounded-full font-bold transition-all px-8 py-4 shadow-md hover:shadow-lg flex items-center justify-center gap-2 disabled:opacity-50 text-lg"
              >
                Submit <ArrowRightIcon className="w-5 h-5" />
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function FinalReport({ data, userDetails, onCopy, copied, onBack }) {
  const [isSavingCloud, setIsSavingCloud] = useState(false);

  const handleSaveCloud = () => {
    setIsSavingCloud(true);
    // Simulate API call to save to thrivecoaching.ai
    setTimeout(() => setIsSavingCloud(false), 3000);
  };

  return (
    <div className="animate-in fade-in slide-in-from-bottom-8 duration-700">
      
      <div className="text-center mb-12 print:hidden">
        <div className="inline-flex items-center justify-center w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full mb-6 shadow-inner border-4 border-white transform hover:rotate-12 transition-transform">
          <span className="text-4xl">🎉</span>
        </div>
        <h2 className="text-slate-800 font-black text-4xl md:text-5xl mb-4 tracking-tight">Congratulations{userDetails.interviewee ? `, ${userDetails.interviewee.split(' ')[0]}` : ''}!</h2>
        <p className="text-slate-600 text-lg md:text-xl leading-relaxed max-w-2xl mx-auto">
          You've done incredible work uncovering your core strengths. Here is your official THRiVE Report, ready for action.
        </p>
      </div>

      <div className="bg-slate-50 border-2 border-slate-100 p-6 md:p-10 rounded-3xl mb-12 relative overflow-hidden shadow-inner print:shadow-none print:border-none print:p-0 print:bg-white">
        
        {/* Branding Header */}
        <div className="border-b-2 border-slate-200 pb-6 mb-8 text-center md:text-left">
          <h3 className="text-slate-800 font-black text-3xl mb-2">
            {userDetails.interviewee ? `${userDetails.interviewee.toUpperCase()}'S THRIVE REPORT` : 'YOUR THRIVE REPORT'}
          </h3>
          <p className="text-slate-500 uppercase tracking-widest font-bold text-sm leading-relaxed">
            Created by Dr. Steve Huff • Based on the Strengths Model • Powered by Gemini
            {userDetails.interviewer && <><br/><span className="text-blue-600">Interviewed by {userDetails.interviewer}</span></>}
          </p>
        </div>

        {/* 6 Sections Grid */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10 text-slate-700">
          {SECTIONS.map((sec) => (
            <div key={sec.id} className="group">
              <div className="flex items-center gap-3 mb-4">
                <div className={`w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-xl border border-slate-100`}>
                  {sec.icon}
                </div>
                <h4 className={`text-slate-800 font-black text-lg uppercase tracking-widest border-b-2 pb-1 border-${sec.color}-200 group-hover:border-${sec.color}-400 transition-colors`}>
                  {sec.title}
                </h4>
              </div>
              <div className="text-slate-600 leading-relaxed whitespace-pre-wrap pl-2 border-l-2 border-slate-200">
                {data[sec.key] || "No response provided."}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Action Buttons Container */}
      <div className="flex flex-col gap-6 print:hidden">
        
        {/* Primary Save Actions */}
        <div className="flex flex-col sm:flex-row justify-center items-center gap-4">
          <button 
            onClick={() => window.print()}
            className="w-full sm:w-auto bg-slate-900 hover:bg-slate-800 text-white rounded-full font-bold transition-all px-8 py-4 shadow-lg hover:shadow-xl flex items-center justify-center gap-3 text-lg"
          >
            <PdfIcon className="w-6 h-6" /> Save as PDF
          </button>

          <button 
            onClick={handleSaveCloud}
            className={`w-full sm:w-auto rounded-full font-bold transition-all px-8 py-4 shadow-lg hover:shadow-xl flex items-center justify-center gap-3 text-lg
              ${isSavingCloud ? 'bg-purple-500 text-white ring-4 ring-purple-100' : 'bg-purple-600 hover:bg-purple-700 text-white'}
            `}
          >
            {isSavingCloud ? <><CheckIcon className="w-6 h-6" /> Saved to thrivecoaching.ai!</> : <><CloudIcon className="w-6 h-6" /> Save to Free Account</>}
          </button>

          <button 
            onClick={onCopy}
            className={`w-full sm:w-auto rounded-full font-bold transition-all px-8 py-4 shadow-lg hover:shadow-xl flex items-center justify-center gap-3 text-lg
              ${copied ? 'bg-emerald-500 text-white ring-4 ring-emerald-100' : 'bg-blue-600 hover:bg-blue-700 text-white'}
            `}
          >
            {copied ? <><CheckIcon className="w-6 h-6" /> Copied!</> : <><CopyIcon className="w-6 h-6" /> Copy Text</>}
          </button>
        </div>

        {/* Secondary Action */}
        <div className="flex justify-center mt-4">
          <button 
            onClick={onBack}
            className="text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-full font-bold transition-all px-8 py-3 flex items-center justify-center gap-2 text-md"
          >
            <ArrowLeftIcon className="w-5 h-5" /> Back to Edit Responses
          </button>
        </div>

      </div>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
